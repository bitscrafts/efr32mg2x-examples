name: Examples

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  build:
    name: build the layers that only need crates.io
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install the target
        run: rustup target add thumbv8m.main-none-eabihf

      - name: Build the PAC layer
        run: cargo build --release --examples -p pac-examples

      # The HAL layer stays out until efr32mg2x-hal is on crates.io. This step is the reminder, not a
      # disabled check: the day the crate is published, uncommenting it is the whole change.
      - name: Is the HAL published yet?
        run: |
          if curl -sf "https://index.crates.io/ef/r3/efr32mg2x-hal" >/dev/null 2>&1; then
            echo "efr32mg2x-hal is on crates.io -- build it and put it back in the workspace members"
            exit 1
          else
            echo "efr32mg2x-hal is not on crates.io yet; the HAL layer is not built here"
          fi

      - name: Every image must load above the bootloader
        run: |
          for f in target/thumbv8m.main-none-eabihf/release/examples/*; do
            [ -x "$f" ] || continue
            python3 elf-load-range.py "$f" | head -1
          done | tee /tmp/ranges.txt
          if grep -q "load_min=0x0800[0-5]" /tmp/ranges.txt; then
            echo "an image loads inside the bootloader region"; exit 1
          fi

# The radio, board and Expansion Base layers are built locally, not here: they depend on the project tree because the
# radio crate carries the vendor Bluetooth and RAIL binaries and is not published. A workflow that skipped them
# silently would be worse than no workflow, so they are named in the README instead.
