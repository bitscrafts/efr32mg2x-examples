# One crate per layer, so a reader testing the PAC pulls the PAC and nothing else.
[workspace]
members = [
    "pac-examples",
    "hal-examples",
    "radio-examples",
    "bsp-examples",
    "expansion-examples",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/bitscrafts/efr32mg2x-examples"
